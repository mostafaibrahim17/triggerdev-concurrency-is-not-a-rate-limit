<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">concurrencyLimit is not a rate limit</title>
  <desc id="d">Repository banner. A queue sized by Little's Law against a vendor allowing five requests a second, with a small chart showing DEV throughput flat at 74 percent of the allowance while PROD climbs to 98 percent.</desc>
  <rect width="1200" height="260" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#dbe2e8"/>
  <rect x="0" y="0" width="1200" height="4" fill="#3b6cf6"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="64" y="78" font-size="15" font-weight="600" letter-spacing="2.4" fill="#3b6cf6">TRIGGER.DEV &#183; SDK 4.5.10</text>
    <text x="64" y="140" font-size="44" font-weight="600" fill="#16212b">concurrencyLimit</text>
    <text x="64" y="192" font-size="44" font-weight="600" fill="#8494a1">is not a rate limit</text>
    <text x="64" y="228" font-size="15" fill="#5b6a77">10,000 lookups &#183; a vendor allowing 5 req/s &#183; measured in DEV and PROD</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <line x1="720" y1="75.1" x2="1150" y2="75.1" stroke="#8494a1" stroke-dasharray="4 4" stroke-width="1.2"/>
    <text x="1150" y="67.1" text-anchor="end" font-size="11" fill="#5b6a77">vendor allows 5 req/s</text>
    <path d="M720.0,190.4 L781.4,168.2 L842.9,150.4 L904.3,123.2 L965.7,112.1 L1027.1,112.1 L1088.6,111.2 L1150.0,111.2" fill="none" stroke="#8494a1" stroke-width="2.4" stroke-dasharray="5 3"/>
    <path d="M720.0,190.9 L781.4,165.4 L842.9,150.4 L904.3,111.2 L965.7,97.1 L1027.1,93.2 L1088.6,107.9 L1150.0,78.2" fill="none" stroke="#3b6cf6" stroke-width="2.8"/>
    <circle cx="720.0" cy="190.9" r="3" fill="#3b6cf6"/><circle cx="781.4" cy="165.4" r="3" fill="#3b6cf6"/><circle cx="842.9" cy="150.4" r="3" fill="#3b6cf6"/><circle cx="904.3" cy="111.2" r="3" fill="#3b6cf6"/><circle cx="965.7" cy="97.1" r="3" fill="#3b6cf6"/><circle cx="1027.1" cy="93.2" r="3" fill="#3b6cf6"/><circle cx="1088.6" cy="107.9" r="3" fill="#3b6cf6"/><circle cx="1150.0" cy="78.2" r="3" fill="#3b6cf6"/>
    <text x="1150" y="133.2" text-anchor="end" font-size="12" font-weight="600" fill="#5b6a77">DEV, 74%</text>
    <text x="1150" y="68.2" text-anchor="end" font-size="12" font-weight="600" fill="#3b6cf6">PROD, 98%</text>
  </g>
</svg>
