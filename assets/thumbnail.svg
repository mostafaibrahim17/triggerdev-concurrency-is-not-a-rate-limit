<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">I measured my queue in DEV. Production disagreed.</title>
  <desc id="d">The same concurrency sweep run twice. In DEV, throughput flattened at 74 percent of the vendor's allowance and a requested limit of 20 only ever ran 13. In PROD the same sweep reached 98 percent and all 20 slots ran.</desc>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="6" fill="#3b6cf6"/>
  <line x1="600" y1="300" x2="600" y2="606" stroke="#e6ebef" stroke-width="1.5"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">

    <text x="96" y="104" font-size="17" font-weight="600" letter-spacing="2.6" fill="#3b6cf6">TRIGGER.DEV &#183; ONE SWEEP, TWO ENVIRONMENTS</text>
    <text x="96" y="196" font-size="66" font-weight="600" letter-spacing="-2.2" fill="#16212b">I measured my queue in DEV.</text>
    <text x="96" y="268" font-size="66" font-weight="600" letter-spacing="-2.2" fill="#8494a1">Production disagreed.</text>

    <text x="96" y="352" font-size="17" font-weight="600" letter-spacing="2" fill="#8494a1">DEV</text>
    <line x1="96" y1="391.7" x2="496" y2="391.7" stroke="#c7d1d9" stroke-dasharray="4 4"/>
    <path d="M96.0,471.6 L153.1,456.2 L210.3,443.9 L267.4,425.0 L324.6,417.3 L381.7,417.3 L438.9,416.7 L496.0,416.7" fill="none" stroke="#8494a1" stroke-width="3.5" stroke-dasharray="7 4"/>
    <circle cx="496.0" cy="416.7" r="6" fill="#8494a1"/>
    <text x="96" y="566" font-size="72" font-weight="600" letter-spacing="-2" fill="#8494a1">74%</text>
    <text x="246" y="566" font-size="19" fill="#5b6a77">of the vendor's rate</text>
    <text x="96" y="598" font-size="19" fill="#5b6a77">13 of the 20 slots asked for</text>

    <text x="704" y="352" font-size="17" font-weight="600" letter-spacing="2" fill="#3b6cf6">PROD</text>
    <line x1="704" y1="391.7" x2="1104" y2="391.7" stroke="#c7d1d9" stroke-dasharray="4 4"/>
    <path d="M704.0,472.0 L761.1,454.3 L818.3,443.9 L875.4,416.7 L932.6,406.9 L989.7,404.2 L1046.9,414.4 L1104.0,393.8" fill="none" stroke="#3b6cf6" stroke-width="3.5"/>
    <circle cx="1104.0" cy="393.8" r="6" fill="#3b6cf6"/>
    <text x="704" y="566" font-size="72" font-weight="600" letter-spacing="-2" fill="#3b6cf6">98%</text>
    <text x="854" y="566" font-size="19" fill="#5b6a77">of the vendor's rate</text>
    <text x="704" y="598" font-size="19" fill="#5b6a77">20 of the 20 slots asked for</text>
  </g>
</svg>
