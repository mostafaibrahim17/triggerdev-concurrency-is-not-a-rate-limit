  <circle cx="837.4" cy="171.9" r="5" fill="#8494a1"/>
  <circle cx="964.0" cy="171.9" r="5" fill="#8494a1"/>
  <text x="964.0" y="191.9" text-anchor="end" font-size="15" font-weight="600" fill="#5b6a77">DEV, flat at 74%</text>

