  <circle cx="964.0" cy="103.1" r="5" fill="#3b6cf6"/>
  <text x="964.0" y="91.1" text-anchor="end" font-size="15" font-weight="600" fill="#3b6cf6">PROD, 98% at a limit of 20</text>

