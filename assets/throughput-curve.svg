  <rect x="0.5" y="0.5" width="999" height="459" fill="none" stroke="#dbe2e8"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <line x1="78" y1="328.1428571428571" x2="964" y2="328.1428571428571" stroke="#e6ebef"/>
  <text x="68" y="332.1428571428571" text-anchor="end" font-size="14" fill="#5b6a77">1</text>
  <line x1="78" y1="270.2857142857143" x2="964" y2="270.2857142857143" stroke="#e6ebef"/>
  <text x="68" y="274.2857142857143" text-anchor="end" font-size="14" fill="#5b6a77">2</text>
  <line x1="78" y1="212.42857142857144" x2="964" y2="212.42857142857144" stroke="#e6ebef"/>
  <text x="68" y="216.42857142857144" text-anchor="end" font-size="14" fill="#5b6a77">3</text>
  <line x1="78" y1="154.57142857142856" x2="964" y2="154.57142857142856" stroke="#e6ebef"/>
  <text x="68" y="158.57142857142856" text-anchor="end" font-size="14" fill="#5b6a77">4</text>
  <line x1="78" y1="96.71428571428572" x2="964" y2="96.71428571428572" stroke="#e6ebef"/>
  <text x="68" y="100.71428571428572" text-anchor="end" font-size="14" fill="#5b6a77">5</text>
  <line x1="78" y1="386" x2="964" y2="386" stroke="#c7d1d9"/>
  <line x1="78" y1="96.71428571428572" x2="964" y2="96.71428571428572" stroke="#8494a1" stroke-dasharray="5 4"/>
  <text x="964" y="89.71428571428572" text-anchor="end" font-size="14" fill="#5b6a77">vendor allows 5 req/s</text>

  <path d="M78.0,336.8 L204.6,290.5 L331.1,253.5 L457.7,196.8 L584.3,173.7 L710.9,173.7 L837.4,171.9 L964.0,171.9" fill="none" stroke="#8494a1" stroke-width="3" stroke-dasharray="6 3"/>
