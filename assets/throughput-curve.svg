  <circle cx="737.7" cy="158.5" r="4" fill="currentColor"/>
  <circle cx="850.0" cy="158.5" r="4" fill="currentColor"/>
  <text x="850.0" y="178.5" text-anchor="end" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.65">DEV, flat at 74%</text>

