  <text x="54" y="313.92857142857144" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">1</text>
  <line x1="64" y1="253.85714285714286" x2="850" y2="253.85714285714286" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="54" y="257.8571428571429" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">2</text>
  <line x1="64" y1="197.78571428571428" x2="850" y2="197.78571428571428" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="54" y="201.78571428571428" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">3</text>
  <line x1="64" y1="141.71428571428572" x2="850" y2="141.71428571428572" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="54" y="145.71428571428572" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">4</text>
  <line x1="64" y1="85.64285714285711" x2="850" y2="85.64285714285711" stroke="currentColor" stroke-opacity="0.1"/>
  <text x="54" y="89.64285714285711" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">5</text>
  <line x1="64" y1="366" x2="850" y2="366" stroke="currentColor" stroke-opacity="0.35"/>
  <line x1="64" y1="85.64285714285711" x2="850" y2="85.64285714285711" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  <text x="850" y="78.64285714285711" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.65">vendor allows 5 req/s</text>

  <path d="M64.0,318.3 L176.3,273.5 L288.6,237.6 L400.9,182.6 L513.1,160.2 L625.4,160.2 L737.7,158.5 L850.0,158.5" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="6 3"/>
