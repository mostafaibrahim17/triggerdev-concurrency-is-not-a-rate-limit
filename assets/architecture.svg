<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
  <title id="t">How the fan-out is paced</title>
  <desc id="d">Ten thousand companies are fanned out by a batch trigger into a queue. The queue admits a few runs at a time to a third-party API that allows five requests per second. Rejected calls return a 429 with a reset timestamp and wait, holding their concurrency slot.</desc>

  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .card  { fill: #ffffff; stroke: #dbe2e8; }
    .sunk  { fill: #f1f4f6; stroke: #dbe2e8; }
    .ink   { fill: #16212b; }
    .muted { fill: #5b6a77; }
    .faint { fill: #8494a1; }
    .rule  { stroke: #dbe2e8; }
    .flow  { stroke: #5b6a77; }
    .acc      { fill: #10656b; }
    .accStroke{ stroke: #10656b; }
    .accFill  { fill: #e3efef; stroke: #10656b; }
    .warn       { fill: #8a5a1c; }
    .warnStroke { stroke: #8a5a1c; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0e151b; }
      .card  { fill: #141d25; stroke: #253340; }
      .sunk  { fill: #101820; stroke: #253340; }
      .ink   { fill: #e4ebf0; }
      .muted { fill: #93a4b2; }
      .faint { fill: #6b7c8a; }
      .rule  { stroke: #253340; }
      .flow  { stroke: #93a4b2; }
      .acc      { fill: #4fb0a8; }
      .accStroke{ stroke: #4fb0a8; }
      .accFill  { fill: #16302f; stroke: #4fb0a8; }
      .warn       { fill: #c9964e; }
      .warnStroke { stroke: #c9964e; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h  { font-size: 14px; font-weight: 650; }
    .s  { font-size: 11.5px; }
    .xs { font-size: 10.5px; }
    .m  { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .lbl { font-size: 9.5px; font-weight: 600; letter-spacing: .09em; }
  </style>

  <rect class="bg" width="900" height="460"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="acc"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="warn"/>
    </marker>
  </defs>

  <!-- 1. records -->
  <g>
    <rect class="card" x="40" y="112" width="118" height="74" rx="4" stroke-width="1" transform="translate(8,8)" opacity=".35"/>
    <rect class="card" x="40" y="112" width="118" height="74" rx="4" stroke-width="1" transform="translate(4,4)" opacity=".6"/>
    <rect class="card" x="40" y="112" width="118" height="74" rx="4" stroke-width="1"/>
    <text class="ink h" x="99" y="142" text-anchor="middle">10,000</text>
    <text class="muted s" x="99" y="160" text-anchor="middle">records</text>
    <text class="faint lbl" x="99" y="205" text-anchor="middle">INPUT</text>
  </g>

  <path d="M172,149 L214,149" class="accStroke" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- 2. fan-out -->
  <g>
    <rect class="card" x="222" y="112" width="140" height="74" rx="4" stroke-width="1"/>
    <text class="ink h" x="292" y="140" text-anchor="middle">Fan out</text>
    <text class="acc m" x="292" y="159" text-anchor="middle">batchTrigger()</text>
    <text class="muted xs" x="292" y="175" text-anchor="middle">streamed, 1 run per company</text>
    <text class="faint lbl" x="292" y="205" text-anchor="middle">INSTANT</text>
  </g>

  <path d="M376,149 L418,149" class="accStroke" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- 3. queue -->
  <g>
    <rect class="sunk" x="426" y="86" width="230" height="126" rx="5" stroke-width="1"/>
    <text class="faint lbl" x="441" y="106">ENRICHMENT QUEUE</text>

    <!-- waiting runs -->
    <g class="faint">
      <circle cx="450" cy="132" r="4.5"/><circle cx="466" cy="132" r="4.5"/><circle cx="482" cy="132" r="4.5"/>
      <circle cx="450" cy="148" r="4.5"/><circle cx="466" cy="148" r="4.5"/><circle cx="482" cy="148" r="4.5"/>
      <circle cx="450" cy="164" r="4.5"/><circle cx="466" cy="164" r="4.5"/><circle cx="482" cy="164" r="4.5"/>
    </g>
    <text class="faint xs" x="466" y="188" text-anchor="middle">queued</text>

    <!-- the gate -->
    <line x1="508" y1="118" x2="508" y2="182" class="accStroke" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text class="acc m" x="508" y="112" text-anchor="middle">2</text>

    <!-- in flight -->
    <rect class="accFill" x="532" y="118" width="108" height="26" rx="3" stroke-width="1.2"/>
    <text class="acc m" x="586" y="135" text-anchor="middle">run · executing</text>
    <rect class="accFill" x="532" y="152" width="108" height="26" rx="3" stroke-width="1.2"/>
    <text class="acc m" x="586" y="169" text-anchor="middle">run · executing</text>
    <text class="faint xs" x="586" y="196" text-anchor="middle">in flight</text>
  </g>

  <path d="M666,149 L708,149" class="accStroke" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- 4. api -->
  <g>
    <rect class="card" x="716" y="112" width="144" height="74" rx="4" stroke-width="1"/>
    <text class="ink h" x="788" y="140" text-anchor="middle">Mock vendor (in repo)</text>
    <text class="muted s" x="788" y="159" text-anchor="middle">5 requests / second</text>
    <text class="muted xs" x="788" y="175" text-anchor="middle">600ms per call</text>
    <text class="faint lbl" x="788" y="205" text-anchor="middle">THE CONSTRAINT</text>
  </g>

  <!-- 429 return path -->
  <path d="M788,196 L788,246 Q788,254 780,254 L594,254 Q586,254 586,246 L586,186"
        class="warnStroke" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#aw)"/>
  <rect class="card" x="606" y="242" width="152" height="24" rx="3" stroke-width="1"/>
  <text class="warn m" x="682" y="258" text-anchor="middle">429 → wait.until(reset)</text>

  <text class="warn xs" x="586" y="292" text-anchor="middle">the waiting run keeps its slot</text>

  <!-- divider -->
  <line x1="40" y1="330" x2="860" y2="330" class="rule" stroke-width="1"/>

  <!-- sizing note -->
  <text class="faint lbl" x="40" y="360">SIZING THE GATE</text>
  <text class="muted s" x="40" y="384">Trigger.dev has no requests-per-second setting. Convert the API's rate into a concurrency with Little's Law:</text>
  <text class="acc m" x="40" y="412" font-size="13">concurrency ≈ rate × time in system  →  (5 ÷ 3 calls) × 3.41s ≈ 6</text>
  <text class="muted s" x="40" y="434">Six is the floor, not the target. Climb from there and the 429 path above absorbs the overshoot.</text>
</svg>
